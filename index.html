<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero.
         Without it the add-item bar sits under the iOS home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Larder</title>
    <meta name="description" content="A realtime household grocery list." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#27583c" />

    <!-- iOS standalone behaviour. Without apple-touch-icon, iOS uses a
         screenshot of the page as the home-screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groceries" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <style>
      /* Painted before any JS runs, so a cold start on a slow connection is
         the app's background colour rather than a white flash. */
      html {
        background: rgb(var(--c-50, 242 248 244));
      }
      html.dark {
        background: rgb(var(--c-950, 14 33 23));
      }
    </style>

    <script>
      // Runs before first paint so the saved theme and text size are already
      // applied. Without it there is a visible flash of the wrong theme on
      // every cold start, which is especially ugly in standalone mode.
      ;(function () {
        try {
          var raw = localStorage.getItem('larder.preferences')
          var prefs = raw ? JSON.parse(raw) : {}
          var theme = prefs.theme || 'system'
          var size = prefs.textSize || 'normal'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = theme === 'dark' || (theme === 'system' && prefersDark)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.classList.add('text-size-' + size)
          root.style.colorScheme = dark ? 'dark' : 'light'

          // Only the two background steps, so a non-default accent does not
          // flash green before React mounts and writes the full ramp. Keep in
          // step with ACCENT_RAMPS in src/lib/themes.ts.
          var bg = {
            larder: ['242 248 244', '14 33 23'],
            teal: ['240 253 250', '4 47 46'],
            sky: ['240 249 255', '8 47 73'],
            indigo: ['238 242 255', '30 27 75'],
            violet: ['245 243 255', '46 16 101'],
            pink: ['253 242 248', '80 7 36'],
            rose: ['255 241 242', '76 5 25'],
            orange: ['255 247 237', '67 20 7'],
            amber: ['255 251 235', '69 26 3'],
            slate: ['248 250 252', '2 6 23'],
          }[prefs.accent] || null
          if (bg) {
            root.style.setProperty('--c-50', bg[0])
            root.style.setProperty('--c-950', bg[1])
          }
        } catch (e) {
          /* Private mode or corrupt value — fall back to the CSS defaults. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
