project_id = "hysfurwkmedolzzeabdv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the linked project, which reports 17.6.1 — a mismatch makes the
# CLI refuse to start the local stack and muddles `db diff` output.
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/update-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Password auth only — Larder never issues a magic link. On iOS a magic link
# opens in Safari, which lands the session in a different storage container
# from the installed home-screen app, and the user looks permanently signed out.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false

[functions.siri]
# Siri sends its own bearer token (larder_<32 hex>), not a Supabase JWT. With
# verify_jwt left on, the platform rejects the request before the function
# runs and every Shortcut invocation returns an opaque 401.
verify_jwt = false
