project_id = "hysfurwkmedolzzeabdv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the linked project, which reports 17.6.1 — a mismatch makes the
# CLI refuse to start the local stack and muddles `db diff` output.
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Where Supabase sends people when an email link has no valid redirect_to, and
# the fallback for every auth email. Left at Supabase's default of
# http://localhost:3000 this silently breaks every reset and confirmation link
# on every device that is not the developer's laptop.
site_url = "https://larder-topaz.vercel.app"

# A redirect_to that is not on this list is ignored and replaced by site_url —
# no error, no warning, the link just goes somewhere useless. Both real routes
# are listed explicitly, plus a wildcard for preview deploys and localhost for
# development.
additional_redirect_urls = [
  "https://larder-topaz.vercel.app",
  "https://larder-topaz.vercel.app/confirm",
  "https://larder-topaz.vercel.app/update-password",
  "https://larder-topaz.vercel.app/**",
  "http://localhost:5173",
  "http://localhost:5173/confirm",
  "http://localhost:5173/update-password",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# These are not cosmetic. `config push` sends the whole auth block, so leaving
# them unset pushes the CLI's local-dev defaults — which drop the resend
# interval to 1 second (an open invitation to use the project as a mail relay)
# and shorten the one-time code. Pinned to the hosted defaults.
max_frequency = "60s"
otp_length = 8
otp_expiry = 3600
# Password auth only — Larder never issues a magic link. On iOS a magic link
# opens in Safari, which lands the session in a different storage container
# from the installed home-screen app, and the user looks permanently signed out.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false

[functions.siri]
# Siri sends its own bearer token (larder_<32 hex>), not a Supabase JWT. With
# verify_jwt left on, the platform rejects the request before the function
# runs and every Shortcut invocation returns an opaque 401.
verify_jwt = false
