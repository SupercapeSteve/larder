name: keepalive

# Supabase pauses a free-tier project after seven days with no activity, and an
# unpausing project is a broken grocery list at exactly the wrong moment. One
# real query a day is enough to keep it awake.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_...
#
# The publishable key is safe here — it is the same key the browser ships with,
# and public.keepalive() reads no table.

on:
  schedule:
    # 06:17 UTC, deliberately off the hour: GitHub delays crons that pile up on
    # round numbers, and a delayed keepalive is a paused project.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY must both be set as repository secrets."
            exit 1
          fi

          # A publishable key may only be sent as a Bearer token when it exactly
          # matches the apikey header. It does here, so both are the same value.
          status=$(curl -sS -o /tmp/keepalive.out -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -d '{}')

          echo "HTTP ${status}"
          cat /tmp/keepalive.out
          echo

          if [ "$status" != "200" ]; then
            echo "::error::Keepalive ping failed with HTTP ${status}. The project may be paused or the key may be wrong."
            exit 1
          fi

          echo "Project is awake."
